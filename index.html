<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KB 20 min">
<meta name="theme-color" content="#6f9fd8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1233" media="(prefers-color-scheme: dark)">
<title>KB 20 min</title>
<link id="touch-icon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23ff6a1a'/%3E%3Cpath d='M62 80a28 28 0 0 1 56 0' fill='none' stroke='%23fff' stroke-width='12' stroke-linecap='round'/%3E%3Ccircle cx='90' cy='116' r='34' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:rgba(255,255,255,.25); --card:rgba(255,255,255,.2); --text:#16294a; --muted:#51698c; --line:rgba(70,100,150,.16);
  --accent:#e8607f; --accent-t:#fff; --ok:#1f9d63; --warn:#e0a100; --bad:#d63d4a;
  --A:linear-gradient(135deg,#ff9a6b,#ee6a8c); --B:linear-gradient(135deg,#5aa0f0,#7f7ae8); --C:linear-gradient(135deg,#35c0a0,#4aa6d8);
  --nav:rgba(255,255,255,.18);--sky:linear-gradient(180deg,#6f9fd8 0%,#9bc0e6 38%,#c4dcee 68%,#efdfe6 100%);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:rgba(255,255,255,.08); --card:rgba(255,255,255,.07); --text:#f2f1fa; --muted:#aab0d4; --line:rgba(255,255,255,.12);
    --nav:rgba(20,22,60,.2);--sky:linear-gradient(180deg,#0b1233 0%,#252a68 40%,#5d4a8c 72%,#b4708f 100%);--accent:#f27a98}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#9bc0e6;color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;background:var(--sky);z-index:-1}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#app{max-width:560px;margin:0 auto;padding:12px 14px calc(88px + env(safe-area-inset-bottom))}
h1{font-size:30px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:0 0 4px}
.card,.stat,.week,.day,.cal-nav button{-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.card{box-shadow:0 4px 20px rgba(40,70,130,.10);border:1px solid rgba(255,255,255,.4);background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;touch-action:manipulation}
.btn{background:linear-gradient(135deg,#ff8a5c,#e8607f);box-shadow:0 6px 16px rgba(232,96,127,.35);color:var(--accent-t);border-radius:14px;padding:12px 18px;font-weight:700;min-height:52px;width:100%;font-size:17px}
.btn.sec{box-shadow:none;background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.small{width:auto;min-height:44px;padding:10px 16px;font-size:15px}
.btn:active{opacity:.8}
.badge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#fff;font-weight:800;font-size:22px;flex:none}
.badge.A{background:var(--A)}.badge.B{background:var(--B)}.badge.C{background:var(--C)}
.head{display:flex;gap:12px;align-items:center}
.pick{display:flex;gap:6px;margin:10px 0 0}
.pick button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:700}
.pick button.on{background:linear-gradient(135deg,#ff8a5c,#e8607f);color:#fff;border-color:var(--accent)}
.ex{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .n{color:var(--muted);font-weight:700;width:20px;flex:none;padding-top:2px}
.ex .t{flex:1;min-width:0}
.ex .name{font-weight:600}
.ex .meta{color:var(--muted);font-size:14px;margin-top:2px}
.ex .msg{font-size:13px;margin-top:4px;color:var(--accent)}
.ex .msg.pain{color:var(--bad)}
.load{background:var(--bg);border-radius:10px;padding:6px 10px;font-weight:800;min-height:44px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.ex.now{background:color-mix(in srgb,var(--accent) 14%,transparent);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:12px}
.timer{text-align:center}
.clock{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px;line-height:1.05}
.cur{font-size:20px;font-weight:700;margin:4px 0}
.cur small{display:block;font-size:15px;font-weight:500;color:var(--muted)}
.bar{height:8px;background:rgba(255,255,255,.5);border-radius:4px;overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a5c,#e8607f);width:0}
.row{display:flex;gap:8px}
.rounds{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 12px}
.rounds b{font-size:28px;min-width:36px;font-variant-numeric:tabular-nums}
.rounds button{width:52px;border-radius:14px;background:var(--bg);font-size:24px;font-weight:700}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;text-align:left}
.chk .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
ul.plain{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
.fb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.fb button{border:1.5px solid var(--line);border-radius:12px;font-size:22px;background:var(--card);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.fb button span{font-size:11px;color:var(--muted);font-weight:600}
.fb button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.fb button.on[data-f=pain]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.legend{font-size:13px;color:var(--muted);line-height:1.5}
.stars{display:flex;gap:6px}
.stars button{flex:1;border:1.5px solid var(--line);border-radius:12px;font-weight:800;font-size:18px;background:var(--card)}
.stars button.on{background:linear-gradient(135deg,#ff8a5c,#e8607f);color:#fff;border-color:var(--accent)}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px;font:inherit;resize:vertical}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cal-nav button{width:48px;font-size:22px;border-radius:12px;background:var(--card)}
.cal-nav b{font-size:18px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.day{aspect-ratio:1;border-radius:12px;color:var(--text);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;position:relative;min-height:44px;padding:0}
.day.empty{background:none}
.day.today{outline:2px solid var(--accent)}
.day.sel{outline:2px solid var(--text)}
.day .l{display:flex;gap:2px;margin-top:2px}
.day .l i{font-style:normal;font-size:11px;font-weight:800;color:#fff;border-radius:5px;padding:0 5px;line-height:16px}
.day .l i.A{background:var(--A)}.day .l i.B{background:var(--B)}.day .l i.C{background:var(--C)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
.week{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.week b{font-size:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-top:1px solid rgba(255,255,255,.35);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);font-weight:600;gap:1px}
.tabs button span{font-size:22px}
.tabs button.on{color:var(--accent)}
.fin-ex{padding:12px 0;border-top:1px solid var(--line)}
.fin-ex:first-of-type{border-top:0}
.detail div{padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.detail div:first-child{border-top:0}
.back{color:var(--accent);font-weight:600;padding:0;min-height:44px}
.tiny{font-size:13px;color:var(--muted)}
.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs">
  <button data-tab="today"><span>🏋️</span>Aujourd’hui</button>
  <button data-tab="cal"><span>📅</span>Calendrier</button>
</nav>

<script>
"use strict";
/* ---------- Données du programme ---------- */
const KGS=[8,12,20];
const WARMUP=["Halo 8 kg · 10/côté","Goblet squat lent 8 kg · ×10","Swing léger 12 kg · ×10"];
const FINISHER="Planche 30 s · Side plank 30 s/côté · Hollow hold 30 s";
const S={
 A:{name:"Jambes & core",format:"EMOM 16 min · 4 tours",type:"emom",ex:[
  {id:"a1",name:"Swing deux mains",lad:KGS,def:20,n:15,step:2,fmt:n=>n+" reps"},
  {id:"a2",name:"Fente arrière, KB en rack",lad:KGS,def:12,n:8,step:1,fmt:n=>n+"/jambe"},
  {id:"a3",name:"Rowing en appui sur banc",lad:KGS,def:12,n:10,step:1,fmt:n=>n+"/bras"},
  {id:"a4",name:"Hollow hold, KB bras tendus",lad:KGS,def:8,n:30,step:5,fmt:n=>n+" s"}]},
 B:{name:"Bras & core",format:"Circuit 16 min · 3 à 4 tours",type:"circuit",ex:[
  {id:"b1",name:"Clean & press",alt:"alternative : press demi-genou",lad:KGS,def:12,n:8,step:1,fmt:n=>n+"/bras"},
  {id:"b2",name:"Curl marteau",lad:KGS,def:8,n:10,step:1,fmt:n=>n+"/bras"},
  {id:"b3",name:"Extension triceps au-dessus de la tête",lad:KGS,def:12,n:10,step:1,fmt:n=>n+" reps"},
  {id:"b4",name:"Suitcase hold",lad:KGS,def:12,n:30,step:5,fmt:n=>n+" s/côté"},
  {id:"b5",name:"Planche avec pull-through",lad:KGS,def:8,n:30,step:5,fmt:n=>n+" s"}]},
 C:{name:"Trail & stabilité",format:"Circuit 16 min · max de tours à rythme régulier",type:"circuit",ex:[
  {id:"c1",name:"Soulevé de terre roumain sur une jambe",lad:KGS,def:12,n:8,step:1,fmt:n=>n+"/côté"},
  {id:"c2",name:"Step-up, KB en rack ou suitcase",lad:KGS,def:12,n:10,step:1,fmt:n=>n+"/jambe"},
  {id:"c3",name:"Turkish get-up",lad:KGS,def:8,n:2,step:0,fmt:n=>n+"/côté"},
  {id:"c4",name:"Farmer carry, mains inversées à chaque passage",lad:["12+8","20+8","20+12"],def:"20+12",n:40,step:5,fmt:n=>n+" m"},
  {id:"c5",name:"Dead bug",lad:null,def:null,n:10,step:2,fmt:n=>n+" reps"}]}
};
const FB={easy:["😌","Facile"],good:["👍","Bien"],hard:["😤","Dur"],pain:["⚠️","Douleur"]};
const MIN=16*60;

/* ---------- Stockage ---------- */
const KEY="kb20.v1";
let DB;
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  if(!DB||typeof DB!=="object")DB={};
  DB.hist=DB.hist||[];DB.st=DB.st||{};DB.fin=DB.fin||{};}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
load();

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromYmd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const mmss=s=>pad(Math.floor(s/60))+":"+pad(Math.floor(s%60));
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function exState(ex){
  let s=DB.st[ex.id];
  if(!s){s={idx:ex.lad?ex.lad.indexOf(ex.def):0,bonus:0,easy:0,hard:0,pain:false,msg:""};DB.st[ex.id]=s}
  return s;
}
const loadLabel=ex=>{const s=exState(ex);return ex.lad?(String(ex.lad[s.idx]).includes("+")?ex.lad[s.idx]+" kg":ex.lad[s.idx]+" kg"):"Poids du corps"};
const volLabel=ex=>{const s=exState(ex);return ex.fmt(ex.n+s.bonus*ex.step)};
function nextLetter(){
  const last=DB.hist.length?DB.hist.slice().sort((a,b)=>a.ts-b.ts).pop().letter:null;
  return last?{A:"B",B:"C",C:"A"}[last]:"A";
}

/* ---------- État de vue ---------- */
let tab="today",view="main";
let cur=null;               // lettre affichée
let calY,calM,selDay=null;
let finisher=false;
let draft=null;             // fin de séance en cours

/* ---------- Minuteur ---------- */
const T={run:false,start:0,base:0,rounds:0,lastMin:-1,done:false,tick:null,wake:null};
let actx=null;
function beep(freq=880,dur=.18,vol=.4){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=freq;o.type="sine";g.gain.value=vol;
    o.connect(g);g.connect(actx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.stop(actx.currentTime+dur+.02);
  }catch(e){}
}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
const elapsed=()=>T.base+(T.run?(Date.now()-T.start)/1000:0);
async function wakeOn(){try{if(navigator.wakeLock)T.wake=await navigator.wakeLock.request("screen")}catch(e){}}
function wakeOff(){try{T.wake&&T.wake.release();T.wake=null}catch(e){}}
function tStart(){
  if(T.done)tReset();
  beep(660,.08,.01);                    // déverrouille l'audio iOS sur geste utilisateur
  T.run=true;T.start=Date.now();wakeOn();
  if(T.lastMin<0){T.lastMin=0;beep(1000,.35);buzz(200)}
  clearInterval(T.tick);T.tick=setInterval(tTick,250);tTick();
}
function tPause(){T.base=elapsed();T.run=false;clearInterval(T.tick);wakeOff();paintTimer()}
function tReset(){T.run=false;T.base=0;T.lastMin=-1;T.done=false;T.rounds=0;clearInterval(T.tick);wakeOff();paintTimer()}
function tTick(){
  const e=elapsed();
  if(e>=MIN){T.base=MIN;T.run=false;T.done=true;clearInterval(T.tick);wakeOff();
    beep(1200,.7);setTimeout(()=>beep(1200,.7),900);buzz([300,150,300,150,600]);paintTimer();return}
  const m=Math.floor(e/60);
  if(S[cur].type==="emom"&&m!==T.lastMin){T.lastMin=m;beep(1000,.3);buzz(200)}
  else if(S[cur].type==="emom"&&m===T.lastMin){
    const left=Math.ceil(60-(e%60));
    if(left<=3&&T.lastBeepSec!==Math.floor(e)){T.lastBeepSec=Math.floor(e);beep(600,.08,.25)}
  }
  paintTimer();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&T.run){wakeOn();tTick()}});

function paintTimer(){
  const box=$("#timer");if(!box)return;
  const s=S[cur],e=Math.min(elapsed(),MIN),emom=s.type==="emom";
  let clock,line="";
  if(emom){
    const m=Math.min(Math.floor(e/60),15),ex=s.ex[m%4];
    clock=mmss(T.done?0:60-(e%60));
    if(T.lastMin<0&&!T.done)line="Prêt · minute 1";
    else if(T.done)line="Terminé 🎉";
    else line=`Tour ${Math.floor(m/4)+1}/4 · min ${m+1}/16<small>${esc(ex.name)} — ${loadLabel(ex)} · ${volLabel(ex)}</small>`;
    document.querySelectorAll(".ex").forEach((el,i)=>el.classList.toggle("now",T.lastMin>=0&&!T.done&&i===m%4));
  }else{
    clock=mmss(MIN-e);
    line=T.done?"Terminé 🎉":(T.lastMin<0?"Prêt · 16 min":"Rythme régulier");
  }
  $("#clock").textContent=clock;
  $("#curline").innerHTML=line;
  $("#bar").style.width=(e/MIN*100)+"%";
  $("#go").textContent=T.run?"Pause":(T.lastMin>=0&&!T.done?"Reprendre":"Démarrer");
  const r=$("#rounds");if(r)r.textContent=T.rounds;
}

/* ---------- Écran Aujourd'hui ---------- */
function renderToday(){
  if(!cur)cur=nextLetter();
  const s=S[cur];
  const done=DB.hist.some(h=>h.date===ymd(new Date()));
  let h=`<h1>${done?"Séance faite ✅":"Aujourd’hui"}</h1>
  <p class="sub">${new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</p>
  <div class="card"><div class="head"><div class="badge ${cur}">${cur}</div>
    <div><div style="font-weight:700;font-size:19px">${s.name}</div><div class="sub">${s.format}</div></div></div>
    <div class="pick">${["A","B","C"].map(l=>`<button data-pick="${l}" class="${l===cur?"on":""}">${l}${l===nextLetter()?" · prochaine":""}</button>`).join("")}</div></div>

  <h2>Échauffement · 3 min</h2>
  <div class="card"><ul class="plain" style="margin:0">${WARMUP.map(w=>`<li>${w}</li>`).join("")}</ul></div>

  <h2>${s.type==="emom"?"EMOM · 1 exercice par minute":"Circuit"}</h2>
  <div class="card">${s.ex.map((ex,i)=>{const st=exState(ex);return `
    <div class="ex"><div class="n">${s.type==="emom"?i+1:"•"}</div>
      <div class="t"><div class="name">${ex.name}</div>
        <div class="meta">${volLabel(ex)}${ex.alt?" · "+ex.alt:""}</div>
        ${st.msg?`<div class="msg ${st.pain?"pain":""}">${esc(st.msg)}</div>`:""}</div>
      ${ex.lad?`<button class="load" data-ex="${ex.id}" aria-label="Changer la charge">${loadLabel(ex)}</button>`:`<div class="load" style="opacity:.6">PdC</div>`}
    </div>`}).join("")}
    <div class="tiny" style="margin-top:6px">Touche une charge pour la changer à la main.</div></div>

  <h2>Minuteur</h2>
  <div class="card timer" id="timer">
    <div class="clock" id="clock">16:00</div>
    <div class="cur" id="curline"></div>
    <div class="bar"><i id="bar"></i></div>
    ${s.type==="emom"?"":`<div class="rounds"><button data-r="-1">−</button><div><b id="rounds">0</b><div class="tiny">tours</div></div><button data-r="1">+</button></div>`}
    <div class="row"><button class="btn" id="go">Démarrer</button><button class="btn sec small" id="rst" style="width:auto">↺</button></div>
  </div>

  <h2>Finisher gainage · 2 min · optionnel</h2>
  <div class="card"><button class="chk ${finisher?"on":""}" id="fin"><span class="box">${finisher?"✓":""}</span><span>Finisher fait<br><span class="tiny">${FINISHER}</span></span></button></div>

  <button class="btn" id="end" style="margin-top:6px">Terminer la séance</button>`;
  $("#app").innerHTML=h;
  paintTimer();
}

/* ---------- Écran Fin de séance ---------- */
function renderFinish(){
  const s=S[cur];
  const d=draft;
  let h=`<button class="back" id="back">‹ Retour</button>
  <h1>Séance ${cur} terminée</h1><p class="sub">${s.name}${T.rounds?` · ${T.rounds} tour${T.rounds>1?"s":""}`:""}</p>
  <div class="card legend">😌 Facile : j’aurais pu en faire bien plus<br>👍 Bien : 2-3 reps en réserve, technique propre<br>😤 Dur : proche de l’échec ou technique qui se dégrade<br>⚠️ Douleur articulaire</div>
  <div class="card">${s.ex.map(ex=>`<div class="fin-ex"><div style="font-weight:600">${ex.name}</div>
    <div class="tiny">${loadLabel(ex)} · ${volLabel(ex)}</div>
    <div class="fb">${Object.entries(FB).map(([k,[e,l]])=>`<button data-fb="${ex.id}" data-f="${k}" class="${d.fb[ex.id]===k?"on":""}">${e}<span>${l}</span></button>`).join("")}</div></div>`).join("")}</div>
  <h2>Ressenti global</h2>
  <div class="card"><div class="stars">${[1,2,3,4,5].map(n=>`<button data-g="${n}" class="${d.g===n?"on":""}">${n}</button>`).join("")}</div>
    <div class="tiny" style="margin-top:6px">1 = épuisant · 5 = super forme</div></div>
  <h2>Note</h2>
  <textarea id="note" placeholder="Sensations, ajustements, douleurs…">${esc(d.note)}</textarea>
  <button class="btn" id="val" style="margin-top:14px">Valider la séance</button>`;
  $("#app").innerHTML=h;
}

/* ---------- Adaptation des charges ---------- */
function adapt(ex,f){
  const s=exState(ex),top=ex.lad?s.idx>=ex.lad.length-1:true,canVol=ex.step>0;
  s.msg="";s.pain=false;
  if(f==="easy"){
    s.hard=0;
    if(canVol&&s.bonus<2){s.bonus++;s.msg="Facile → volume augmenté"}
    else if(!top){s.idx++;s.bonus=0;s.msg="Facile à répétition → charge supérieure"}
    else if(canVol&&s.bonus<4){s.bonus++;s.msg="Charge max atteinte → volume augmenté"}
    else s.msg="Facile → ralentis le tempo ou rajoute un tour"
  }else if(f==="good"){s.hard=0}
  else if(f==="hard"){
    if(s.bonus>0){s.bonus--;s.msg="Dur → volume réduit"}
    else{s.hard++;
      if(s.hard>=2&&s.idx>0){s.idx--;s.hard=0;s.msg="Dur 2 fois → charge inférieure"}
      else s.msg="Dur → garde la charge, soigne la technique"}
  }else if(f==="pain"){
    s.bonus=0;s.hard=0;s.pain=true;
    if(s.idx>0){s.idx--;s.msg="Douleur → charge réduite. Contrôle la technique"}else s.msg="Douleur signalée → vas-y doucement";
  }
}

function validate(){
  const s=S[cur],d=draft;
  s.ex.forEach(ex=>{if(d.fb[ex.id])adapt(ex,d.fb[ex.id])});
  DB.hist.push({date:ymd(new Date()),ts:Date.now(),letter:cur,fb:d.fb,g:d.g,note:d.note,finisher:finisher,rounds:T.rounds,
    loads:Object.fromEntries(s.ex.map(e=>[e.id,loadLabel(e)]))});
  save();
  tReset();finisher=false;draft=null;cur=null;
  view="main";tab="cal";
  const n=new Date();calY=n.getFullYear();calM=n.getMonth();selDay=ymd(n);
  render();
}

/* ---------- Calendrier ---------- */
function renderCal(){
  const first=new Date(calY,calM,1),days=new Date(calY,calM+1,0).getDate(),off=(first.getDay()+6)%7;
  const by={};DB.hist.forEach(h=>(by[h.date]=by[h.date]||[]).push(h));
  const today=ymd(new Date());
  const ws=weekStart(new Date()),we=new Date(ws);we.setDate(we.getDate()+7);
  const week=DB.hist.filter(h=>{const d=fromYmd(h.date);return d>=ws&&d<we}).length;
  const month=DB.hist.filter(h=>{const d=fromYmd(h.date);return d.getFullYear()===calY&&d.getMonth()===calM}).length;
  const label=first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  let cells="";
  for(let i=0;i<off;i++)cells+=`<div class="day empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=calY+"-"+pad(calM+1)+"-"+pad(d),hs=by[k]||[];
    cells+=`<button class="day ${k===today?"today":""} ${k===selDay?"sel":""}" data-day="${k}">${d}${hs.length?`<span class="l">${hs.map(x=>`<i class="${x.letter}">${x.letter}</i>`).join("")}</span>`:""}</button>`;
  }
  let detail="";
  if(selDay){
    const hs=by[selDay]||[];
    detail=`<h2>${fromYmd(selDay).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</h2><div class="card detail">`+
      (hs.length?hs.map(h=>`<div><b>Séance ${h.letter}</b> — ${S[h.letter].name}${h.g?` · global ${h.g}/5`:""}${h.finisher?" · finisher ✓":""}${h.rounds?` · ${h.rounds} tours`:""}
        <div class="tiny">${S[h.letter].ex.map(e=>`${esc(e.name.split(",")[0])} ${h.fb&&h.fb[e.id]?FB[h.fb[e.id]][0]:"–"}`).join(" · ")}</div>
        ${h.note?`<div class="tiny">📝 ${esc(h.note)}</div>`:""}</div>`).join(""):`<div class="tiny">Aucune séance ce jour-là.</div>`)+`</div>`;
  }
  $("#app").innerHTML=`<h1>Calendrier</h1>
  <div class="week"><span>Cette semaine</span><b style="color:${week>=4?"var(--ok)":"var(--text)"}">${week} / 4-5</b></div>
  <div class="cal-nav"><button data-m="-1" aria-label="Mois précédent">‹</button><b>${label}</b><button data-m="1" aria-label="Mois suivant">›</button></div>
  <div class="grid">${["L","M","M","J","V","S","D"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>
  <div class="stats"><div class="stat"><b>${DB.hist.length}</b><span>séances au total</span></div><div class="stat"><b>${month}</b><span>ce mois</span></div><div class="stat"><b>${streakWeeks()}</b><span>sem. d’affilée ≥ 4</span></div></div>
  ${detail}
  <h2>Données</h2>
  <div class="row"><button class="btn sec small" id="exp">Copier l’export</button><button class="btn sec small" id="rz" style="color:var(--bad)">Réinitialiser</button></div>
  <p class="tiny">Les données restent sur cet iPhone (stockage local de Safari).</p>`;
}
function streakWeeks(){
  const cnt={};DB.hist.forEach(h=>{const k=ymd(weekStart(fromYmd(h.date)));cnt[k]=(cnt[k]||0)+1});
  let w=weekStart(new Date()),n=0;
  if((cnt[ymd(w)]||0)<4)w.setDate(w.getDate()-7);   // semaine en cours pas encore comptée
  while((cnt[ymd(w)]||0)>=4){n++;w.setDate(w.getDate()-7)}
  return n;
}

/* ---------- Rendu & événements ---------- */
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));
  $("#tabs").classList.toggle("hide",view==="finish");
  if(view==="finish")renderFinish();else if(tab==="cal"){if(calY==null){const n=new Date();calY=n.getFullYear();calM=n.getMonth()}renderCal()}else renderToday();
  window.scrollTo(0,0);
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  const d=t.dataset;
  if(d.tab){tab=d.tab;view="main";render();return}
  if(d.pick){if(T.lastMin>=0&&!T.done&&!confirm("Changer de séance remet le minuteur à zéro. Continuer ?"))return;tReset();cur=d.pick;renderToday();return}
  if(d.ex){const ex=Object.values(S).flatMap(x=>x.ex).find(x=>x.id===d.ex),st=exState(ex);
    st.idx=(st.idx+1)%ex.lad.length;st.bonus=0;st.msg="";save();renderToday();return}
  if(d.r){T.rounds=Math.max(0,T.rounds+Number(d.r));paintTimer();return}
  if(t.id==="go"){T.run?tPause():tStart();return}
  if(t.id==="rst"){tReset();return}
  if(t.id==="fin"){finisher=!finisher;t.classList.toggle("on",finisher);t.querySelector(".box").textContent=finisher?"✓":"";return}
  if(t.id==="end"){if(T.run)tPause();draft={fb:{},g:null,note:""};view="finish";render();return}
  if(t.id==="back"){view="main";render();return}
  if(d.fb){draft.fb[d.fb]=d.f;t.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===t));return}
  if(d.g){draft.g=Number(d.g);t.parentNode.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b===t));return}
  if(t.id==="val"){draft.note=$("#note").value.trim();
    const miss=S[cur].ex.filter(x=>!draft.fb[x.id]).length;
    if(miss&&!confirm(miss+" exercice(s) sans ressenti : leur charge ne sera pas adaptée. Valider quand même ?"))return;
    validate();return}
  if(d.m){calM+=Number(d.m);if(calM<0){calM=11;calY--}if(calM>11){calM=0;calY++}render();return}
  if(d.day){selDay=selDay===d.day?null:d.day;renderCal();return}
  if(t.id==="exp"){const j=JSON.stringify(DB);(navigator.clipboard?navigator.clipboard.writeText(j):Promise.reject()).then(()=>alert("Export copié."),()=>prompt("Copie ce texte :",j));return}
  if(t.id==="rz"){if(confirm("Effacer tout l’historique et les charges ?")){DB={hist:[],st:{},fin:{}};save();selDay=null;cur=null;render()}return}
});

/* Icône tactile PNG générée (iOS ignore souvent les SVG) */
try{
  const c=document.createElement("canvas");c.width=c.height=180;const g=c.getContext("2d");
  g.fillStyle="#ff6a1a";g.fillRect(0,0,180,180);
  g.strokeStyle="#fff";g.lineWidth=12;g.lineCap="round";g.beginPath();g.arc(90,80,28,Math.PI,0);g.stroke();
  g.fillStyle="#fff";g.beginPath();g.arc(90,116,34,0,Math.PI*2);g.fill();
  $("#touch-icon").href=c.toDataURL("image/png");
}catch(e){}

render();
</script>
