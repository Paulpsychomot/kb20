<link id="touch-icon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20180%20180'%3E%3Cdefs%3E%3ClinearGradient%20id='s'%20x1='0'%20y1='0'%20x2='.35'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%235f93d6'/%3E%3Cstop%20offset='.5'%20stop-color='%23a9cbe9'/%3E%3Cstop%20offset='1'%20stop-color='%23f2dfe8'/%3E%3C/linearGradient%3E%3ClinearGradient%20id='k'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%23ff9a6b'/%3E%3Cstop%20offset='1'%20stop-color='%23e8607f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='180'%20height='180'%20fill='url%28%23s%29'/%3E%3Cpolygon%20points='-6%2C142%2030%2C112%2056%2C128%2098%2C80%20122%2C98%20160%2C44%20186%2C44%20186%2C186%20-6%2C186'%20fill='url%28%23k%29'%20stroke-linejoin='round'/%3E%3Cpolyline%20points='-6%2C142%2030%2C112%2056%2C128%2098%2C80%20122%2C98%20160%2C44'%20fill='none'%20stroke='%23fff'%20stroke-width='8'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='160'%20cy='44'%20r='9'%20fill='%23fff'/%3E%3C/svg%3E">
<style>
:root{
  --bg:rgba(255,255,255,.25); --card:rgba(255,255,255,.2); --text:#16294a; --muted:#51698c; --line:rgba(70,100,150,.16);
  --accent:#e8607f; --accent-t:#fff; --ok:#1f9d63; --warn:#e0a100; --bad:#d63d4a;
  --A:linear-gradient(135deg,#ff9a6b,#ee6a8c); --B:linear-gradient(135deg,#5aa0f0,#7f7ae8); --C:linear-gradient(135deg,#35c0a0,#4aa6d8);
  --nav:rgba(255,255,255,.18);--sky:linear-gradient(180deg,#6f9fd8 0%,#9bc0e6 38%,#c4dcee 68%,#efdfe6 100%);
  --r:16px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:rgba(255,255,255,.08); --card:rgba(255,255,255,.07); --text:#f2f1fa; --muted:#aab0d4; --line:rgba(255,255,255,.12);
    --nav:rgba(20,22,60,.2);--sky:linear-gradient(180deg,#0b1233 0%,#252a68 40%,#5d4a8c 72%,#b4708f 100%);--accent:#f27a98}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#9bc0e6;color:var(--text);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0;background:var(--sky);z-index:-1}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#app{max-width:560px;margin:0 auto;padding:12px 14px calc(88px + env(safe-area-inset-bottom))}
h1{font-size:30px;font-weight:800;margin:8px 0 2px;letter-spacing:-.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 4px 8px;font-weight:600}
.sub{color:var(--muted);font-size:14px;margin:0 0 4px}
.card,.stat,.week,.day,.cal-nav button{-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%)}
.card{box-shadow:0 4px 20px rgba(40,70,130,.10);border:1px solid rgba(255,255,255,.4);background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:44px;touch-action:manipulation}
.btn{background:linear-gradient(135deg,#ff8a5c,#e8607f);box-shadow:0 6px 16px rgba(232,96,127,.35);color:var(--accent-t);border-radius:14px;padding:12px 18px;font-weight:700;min-height:52px;width:100%;font-size:17px}
.btn.sec{box-shadow:none;background:var(--card);color:var(--text);border:1px solid var(--line)}
.btn.small{width:auto;min-height:44px;padding:10px 16px;font-size:15px}
.btn:active{opacity:.8}
.badge{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;color:#fff;font-weight:800;font-size:22px;flex:none}
.badge.A{background:var(--A)}.badge.B{background:var(--B)}.badge.C{background:var(--C)}
.head{display:flex;gap:12px;align-items:center}
.pick{display:flex;gap:6px;margin:10px 0 0}
.pick button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:12px;font-weight:700}
.pick button.on{background:linear-gradient(135deg,#ff8a5c,#e8607f);color:#fff;border-color:var(--accent)}
.ex{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .n{color:var(--muted);font-weight:700;width:20px;flex:none;padding-top:2px}
.ex .t{flex:1;min-width:0}
.ex .name{font-weight:600}
.ex .meta{color:var(--muted);font-size:14px;margin-top:2px}
.mini{margin-top:6px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:0 12px;font-weight:700;font-size:14px;min-height:44px;font-variant-numeric:tabular-nums}
.ex .msg{font-size:13px;margin-top:4px;color:var(--accent)}
.ex .msg.pain{color:var(--bad)}
.load{background:var(--bg);border-radius:10px;padding:6px 10px;font-weight:800;min-height:44px;min-width:64px;text-align:center;font-variant-numeric:tabular-nums}
.ex.now{background:color-mix(in srgb,var(--accent) 14%,transparent);margin:0 -14px;padding-left:14px;padding-right:14px;border-radius:12px}
.timer{text-align:center}
.clock{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-2px;line-height:1.05}
.cur{font-size:20px;font-weight:700;margin:4px 0}
.cur small{display:block;font-size:15px;font-weight:500;color:var(--muted)}
.bar{height:8px;background:rgba(255,255,255,.5);border-radius:4px;overflow:hidden;margin:10px 0 12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff8a5c,#e8607f);width:0}
.row{display:flex;gap:8px}
.rounds{display:flex;align-items:center;justify-content:center;gap:14px;margin:6px 0 12px}
.rounds b{font-size:28px;min-width:36px;font-variant-numeric:tabular-nums}
.rounds button{width:52px;border-radius:14px;background:var(--bg);font-size:24px;font-weight:700}
.chk{display:flex;align-items:center;gap:12px;min-height:48px;width:100%;text-align:left}
.chk .box{width:28px;height:28px;border-radius:8px;border:2px solid var(--muted);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:none}
.chk.on .box{background:var(--ok);border-color:var(--ok)}
ul.plain{margin:6px 0 0;padding-left:20px;color:var(--muted);font-size:15px}
.fb{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.fb button{border:1.5px solid var(--line);border-radius:12px;font-size:22px;background:var(--card);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.fb button span{font-size:11px;color:var(--muted);font-weight:600}
.fb button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card))}
.fb button.on[data-f=pain]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.legend{font-size:13px;color:var(--muted);line-height:1.5}
.stars{display:flex;gap:6px}
.stars button{flex:1;border:1.5px solid var(--line);border-radius:12px;font-weight:800;font-size:18px;background:var(--card)}
.stars button.on{background:linear-gradient(135deg,#ff8a5c,#e8607f);color:#fff;border-color:var(--accent)}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px;font:inherit;resize:vertical}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 10px}
.cal-nav button{width:48px;font-size:22px;border-radius:12px;background:var(--card)}
.cal-nav b{font-size:18px;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0}
.day{aspect-ratio:1;border-radius:12px;color:var(--text);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;position:relative;min-height:44px;padding:0}
.day.empty{background:none}
.day.today{outline:2px solid var(--accent)}
.day.sel{outline:2px solid var(--text)}
.day .l{display:flex;gap:2px;margin-top:2px}
.day .l i{font-style:normal;font-size:11px;font-weight:800;color:#fff;border-radius:5px;padding:0 5px;line-height:16px}
.day .l i.A{background:var(--A)}.day .l i.B{background:var(--B)}.day .l i.C{background:var(--C)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-size:24px}
.stat span{font-size:12px;color:var(--muted)}
.week{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.week b{font-size:20px}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border-top:1px solid rgba(255,255,255,.35);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--muted);font-weight:600;gap:1px}
.tabs button.on{color:var(--accent)}
.fin-ex{padding:12px 0;border-top:1px solid var(--line)}
.fin-ex:first-of-type{border-top:0}
.detail div{padding:6px 0;border-top:1px solid var(--line);font-size:15px}
.detail div:first-child{border-top:0}
.back{color:var(--accent);font-weight:600;padding:0;min-height:44px}
.tiny{font-size:13px;color:var(--muted)}
.hide{display:none}
:root{--L:linear-gradient(135deg,#ff9a6b,#ee6a8c);--H:linear-gradient(135deg,#5aa0f0,#7f7ae8);--Z:linear-gradient(135deg,#35c0a0,#4aa6d8);--Y:linear-gradient(135deg,#ffb347,#ff7a45);--T:linear-gradient(135deg,#4cbf7a,#2f9d8f);--R:linear-gradient(135deg,#a77bf0,#d96bb5);--M:linear-gradient(135deg,#8aa4c8,#9db6d8);}
.badge.L{background:var(--L)}.day .l i.L{background:var(--L)}
.badge.H{background:var(--H)}.day .l i.H{background:var(--H)}
.badge.Z{background:var(--Z)}.day .l i.Z{background:var(--Z)}
.badge.Y{background:var(--Y)}.day .l i.Y{background:var(--Y)}
.badge.T{background:var(--T)}.day .l i.T{background:var(--T)}
.badge.R{background:var(--R)}.day .l i.R{background:var(--R)}
.badge.M{background:var(--M)}.day .l i.M{background:var(--M)}
.pick.seven{gap:4px}.pick.seven button{padding:2px;min-height:54px;line-height:1.15;font-size:17px}
.pick.seven button small{display:block;font-size:10px;font-weight:600;opacity:.85}
.pick button[data-rt]{font-variant-numeric:tabular-nums}
.inp{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px;font:inherit;font-size:18px;min-height:48px}
.rpe{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rpe button{border:1.5px solid var(--line);border-radius:12px;font-weight:800;font-size:18px;background:var(--card)}
.rpe button.on{background:linear-gradient(135deg,#ff8a5c,#e8607f);color:#fff;border-color:transparent}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;min-height:48px;background:var(--card);text-align:left;font-weight:600}
.opt .cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-weight:800;font-size:15px}
.opt.on{border-color:var(--accent)}
.opt.on .cb{background:var(--accent);border-color:var(--accent)}
.opt.on .cb::after{content:"✓"}
.opt[data-f=pain].on,.opt[data-f=pain].on .cb{border-color:var(--bad)}
.opt[data-f=pain].on .cb{background:var(--bad)}
.day .pl{font-size:10px;font-weight:700;color:var(--muted);margin-top:2px;opacity:.8}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs">
  <button data-tab="today"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Aujourd’hui</button>
  <button data-tab="cal"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendrier</button>
</nav>

<script>
"use strict";
/* ---------- Programme ---------- */
const KGS=[8,12,20];
const reps=n=>n+" reps",side=n=>n+"/côté",leg=n=>n+"/jambe",arm=n=>n+"/bras",sec=n=>n+" s",secS=n=>n+" s/côté";
const G=(id,name,sets,n,fmt,step,o={})=>({id,name,sets,n,fmt,gym:true,step,...o});            // charge libre (salle), progression en kg
const K=(id,name,sets,n,fmt,def,step,o={})=>({id,name,sets,n,fmt,lad:KGS,def,step,...o});     // kettlebell 8/12/20, progression par volume puis charge
const BW=(id,name,sets,n,fmt,step,o={})=>({id,name,sets,n,fmt,lad:null,def:null,step,...o}); // poids du corps

const ACT={
  L:{name:"Renfo · Bas du corps",short:"Bas",kind:"gym",sub:"Salle avec ton coach · ou version KB"},
  H:{name:"Renfo · Haut du corps",short:"Haut",kind:"gym",sub:"Salle avec ton coach · ou version KB"},
  Z:{name:"Course zone 2",short:"Z2",kind:"run",sub:"Mardi : course, ou Hyrox (bouton Hyrox)"},
  Y:{name:"Séance type Hyrox",short:"Hyrox",kind:"run",sub:"Mardi : Hyrox en salle avec ton coach"},
  T:{name:"Séance de course · trail",short:"Trail",kind:"run",sub:"Samedi : sortie longue"},
  R:{name:"Rugby",short:"Rugby",kind:"run",sub:"1 h de course / cardio"},
  M:{name:"Repos",short:"Repos",kind:"light",sub:"Récupération · mobilité facultative"}
};
const LEG={A:"Jambes & core (KB 20 min)",B:"Bras & core (KB 20 min)",C:"Trail & stabilité (KB 20 min)"};
const PLAN={1:"L",2:"Z",3:"M",4:"R",5:"H",6:"T",0:"M"};      // jour de semaine → séance prévue
const PLANTXT={1:"Renfo salle ou KB",2:"Course ou Hyrox",3:"Repos",4:"Rugby",5:"Renfo salle ou maison",6:"Course",0:"Repos"};
const PLANLBL={1:"L",2:"Z/Y",3:"",4:"R",5:"H",6:"T",0:""};
const ESSENTIAL=["L","H","R"];
const WARM=["5 min vélo, rameur ou marche rapide","Mobilité hanches, chevilles, épaules","2 séries d’approche sur le 1er exercice"];
const SES={
 L:{gym:[
   G("lg1","Squat (barre)",4,5,reps,2.5,{leg:1}),
   G("lg2","Soulevé de terre roumain",3,8,reps,2.5,{leg:1}),
   G("lg3","Fente bulgare (haltères)",3,8,leg,2,{leg:1}),
   G("lg4","Développé couché",3,8,reps,2.5),
   G("lg5","Tractions ou tirage vertical",3,8,reps,2.5),
   G("lg6","Mollets debout",3,12,reps,2.5,{leg:1}),
   BW("lg7","Planche",3,40,sec,5)],
  home:[
   K("lh1","Goblet squat, descente lente (3 s)",4,8,reps,20,1,{leg:1}),
   K("lh2","Fente bulgare, KB en rack",3,8,leg,12,1,{leg:1}),
   K("lh3","Soulevé de terre roumain sur une jambe",3,8,side,12,1,{leg:1}),
   K("lh4","Swing deux mains",4,15,reps,20,2,{leg:1}),
   K("lh5","Développé au sol (floor press)",3,10,arm,12,1),
   K("lh6","Rowing en appui sur banc",3,10,arm,20,1),
   K("lh7","Mollets unilatéraux sur marche",3,12,leg,20,2,{leg:1}),
   K("lh8","Hollow hold, KB bras tendus",3,30,sec,8,5)]},
 H:{gym:[
   G("hg1","Développé militaire",4,6,reps,2.5),
   G("hg2","Tractions lestées ou tirage",4,6,reps,2.5),
   G("hg3","Développé incliné haltères",3,10,reps,2),
   G("hg4","Rowing barre ou haltère",3,10,reps,2.5),
   G("hg5","Curl biceps",3,12,reps,1),
   G("hg6","Extension triceps",3,12,reps,1),
   G("hg7","Hip thrust (jambes légères)",3,10,reps,5,{leg:1}),
   BW("hg8","Side plank",3,30,secS,5)],
  home:[
   K("hh1","Clean & press",4,6,arm,12,1),
   K("hh2","Rowing en appui sur banc",4,8,arm,20,1),
   K("hh3","Développé au sol (floor press)",3,10,arm,12,1),
   K("hh4","Curl marteau",3,12,arm,8,1),
   K("hh5","Extension triceps au-dessus de la tête",3,12,reps,12,1),
   K("hh6","Goblet squat (jambes légères)",3,10,reps,12,1,{leg:1}),
   K("hh7","Suitcase hold",3,30,secS,12,5),
   BW("hh8","Pompes, tempo lent",3,10,reps,2)]}
};
const ALLEX=Object.fromEntries(Object.values(SES).flatMap(x=>[...x.gym,...x.home]).map(e=>[e.id,e]));
const FAT={fresh:"Frais",ok:"Normal",tired:"Fatigué",pain:"Douleur"};
const FB={easy:"Facile",good:"Bien",hard:"Dur",pain:"Douleur"};
const DEFDUR={Z:50,Y:50,T:120,R:60,M:15};

function runLines(l,ph){
  if(l==="Z")return["45–60 min en aisance respiratoire : tu peux parler en phrases (≈ 65–75 % FC max)","Terrain vallonné si possible, marche dans les raidillons","Option : 4 à 6 lignes droites de 20 s en fin de sortie"];
  if(l==="Y")return["Séance Hyrox en salle avec ton coach","Pas de salle ? Fais plutôt une sortie zone 2"];
  if(l==="R")return["1 h de course / cardio avec l’équipe","Pas de jambes lourdes la veille ni le jour même","Note l’intensité (RPE) pour ajuster la fin de semaine"];
  if(l==="T"){
    if(ph.k==="spe")return["Sortie longue 3 à 5 h avec un dénivelé proche de ta course","Travaille la nutrition (60–90 g de glucides/h) et les descentes","Option : dos à dos, samedi long + dimanche 1 h – 1 h 30 facile"];
    if(ph.k==="aff")return["Sortie ≤ 1 h 30 à allure course, sensations fraîches","Rien de nouveau, pas de fatigue en plus"];
    return["Sortie longue 1 h 30 – 2 h 30 en endurance (zone 2), +10 % maximum d’une semaine à l’autre","Une semaine sur 4 plus légère (−30 %)","Teste sac, bâtons et ravitaillement"];
  }
  return["Jour de repos : rien d’obligatoire","Option : 10–15 min de mobilité (hanches, chevilles, épaules) ou marche facile","Sommeil et hydratation"];
}

/* ---------- Stockage ---------- */
const KEY="kb20.v1";
let DB;
function load(){try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){DB=null}
  if(!DB||typeof DB!=="object")DB={};
  DB.hist=DB.hist||[];DB.st=DB.st||{};DB.loc=DB.loc||"gym";DB.race=DB.race||null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
load();

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromYmd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
const mmss=s=>pad(Math.floor(s/60))+":"+pad(Math.floor(s%60));
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:null};
function weekStart(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
const exList=l=>SES[l]?SES[l][DB.loc==="home"?"home":"gym"]:[];
function exState(ex){
  let s=DB.st[ex.id];
  if(!s){s=ex.gym?{kg:null,easy:0,hard:0,pain:false,msg:""}:{idx:ex.lad?ex.lad.indexOf(ex.def):0,bonus:0,easy:0,hard:0,pain:false,msg:""};DB.st[ex.id]=s}
  return s;
}
function phase(){
  if(!DB.race)return{k:"base",w:null};
  const w=Math.ceil((fromYmd(DB.race)-new Date())/(7*864e5));
  if(w<0)return{k:"base",w:null};
  return{k:w<=3?"aff":w<=9?"spe":"base",w};
}
const PH={base:["Base","Force et volume à fond, jambes incluses, + endurance"],spe:["Spécifique","Jambes en maintien (−1 série), priorité aux sorties longues"],aff:["Affûtage","Volume réduit : arrive frais sur la course"]};
function setsOf(ex){const p=phase().k;if(p==="spe"&&ex.leg)return Math.max(2,ex.sets-1);if(p==="aff")return ex.leg?2:Math.max(2,ex.sets-1);return ex.sets}
const loadLabel=ex=>{const s=exState(ex);if(ex.gym)return s.kg==null?"Charge ?":s.kg+" kg";return ex.lad?ex.lad[s.idx]+" kg":"Poids du corps"};
const volLabel=ex=>setsOf(ex)+" × "+ex.fmt(ex.n+(ex.gym?0:exState(ex).bonus*ex.step));

/* ---------- Sons ---------- */
let actx=null;
function beep(freq=880,dur=.18,vol=.4){
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended")actx.resume();
    const o=actx.createOscillator(),g=actx.createGain();
    o.frequency.value=freq;o.type="sine";g.gain.value=vol;
    o.connect(g);g.connect(actx.destination);o.start();
    g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+dur);o.stop(actx.currentTime+dur+.02);
  }catch(e){}
}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}

/* ---------- Minuteur de repos ---------- */
let RT=null;
function rtPaint(left){const el=$("#rtclock");if(el)el.textContent=left==null?"--:--":mmss(left);
  document.querySelectorAll("[data-rt]").forEach(b=>b.classList.toggle("on",!!RT&&RT.sec===Number(b.dataset.rt)))}
function rtStop(){if(RT){clearInterval(RT.i);RT=null}rtPaint(null)}
function rtStart(sec){
  if(RT&&RT.sec===sec){rtStop();return}
  rtStop();beep(660,.08,.01);
  const end=Date.now()+sec*1000;
  RT={sec,last:-1,i:setInterval(()=>{
    const left=Math.ceil((end-Date.now())/1000);
    if(left<=0){rtStop();beep(1200,.3);setTimeout(()=>beep(1200,.5),400);buzz([200,100,300]);const el=$("#rtclock");if(el)el.textContent="GO !";return}
    rtPaint(left);
    if(left<=3&&RT&&RT.last!==left){RT.last=left;beep(600,.08,.25)}
  },200)};
  rtPaint(sec);
}

/* ---------- Chrono de sortie ---------- */
const CH={run:false,start:0,base:0,i:null};
const chEl=()=>CH.base+(CH.run?(Date.now()-CH.start)/1000:0);
function chPaint(){const el=$("#chrono");if(el){const e=Math.floor(chEl());el.textContent=Math.floor(e/3600)+":"+mmss(e%3600)}
  const b=$("#chgo");if(b)b.textContent=CH.run?"Pause":(CH.base>0?"Reprendre":"Démarrer")}
function chToggle(){
  if(CH.run){CH.base=chEl();CH.run=false;clearInterval(CH.i)}
  else{CH.run=true;CH.start=Date.now();clearInterval(CH.i);CH.i=setInterval(chPaint,500)}
  chPaint();
}
function chReset(){CH.run=false;CH.base=0;clearInterval(CH.i);chPaint()}

/* ---------- Adaptation des charges ---------- */
function adapt(ex,f){
  const s=exState(ex);s.msg="";s.pain=false;
  if(ex.gym){
    if(s.kg==null)return;
    const st=ex.step,mv=d=>Math.max(0,Math.round((s.kg+d)*10)/10);
    if(f==="easy"){s.hard=0;s.kg=mv(st);s.msg="Facile → +"+st+" kg"}
    else if(f==="good"){s.hard=0}
    else if(f==="hard"){s.hard++;if(s.hard>=2){s.kg=mv(-st);s.hard=0;s.msg="Dur 2 fois → −"+st+" kg"}else s.msg="Dur → garde la charge, soigne la technique"}
    else if(f==="pain"){s.pain=true;s.hard=0;s.kg=mv(-st);s.msg="Douleur → charge réduite. Contrôle la technique"}
    return;
  }
  const top=ex.lad?s.idx>=ex.lad.length-1:true,canVol=ex.step>0;
  if(f==="easy"){
    s.hard=0;
    if(canVol&&s.bonus<2){s.bonus++;s.msg="Facile → volume augmenté"}
    else if(!top){s.idx++;s.bonus=0;s.msg="Facile à répétition → charge supérieure"}
    else if(canVol&&s.bonus<4){s.bonus++;s.msg="Charge max atteinte → volume augmenté"}
    else s.msg="Facile → ralentis le tempo ou rajoute une série"
  }else if(f==="good"){s.hard=0}
  else if(f==="hard"){
    if(s.bonus>0){s.bonus--;s.msg="Dur → volume réduit"}
    else{s.hard++;
      if(s.hard>=2&&s.idx>0){s.idx--;s.hard=0;s.msg="Dur 2 fois → charge inférieure"}
      else s.msg="Dur → garde la charge, soigne la technique"}
  }else if(f==="pain"){
    s.bonus=0;s.hard=0;s.pain=true;
    if(s.idx>0){s.idx--;s.msg="Douleur → charge réduite. Contrôle la technique"}else s.msg="Douleur signalée → vas-y doucement";
  }
}

/* ---------- Semaine ---------- */
function weekHist(d=new Date()){const ws=weekStart(d),we=new Date(ws);we.setDate(we.getDate()+7);
  return DB.hist.filter(h=>{const x=fromYmd(h.date);return x>=ws&&x<we})}
function missed(){
  const dow=(new Date().getDay()+6)%7,wk=weekHist().map(h=>h.letter);
  if(dow>=1&&!wk.includes("L"))return"L";
  if(dow>=5&&!wk.includes("H"))return"H";
  return null;
}
function streakWeeks(){
  const cnt={};DB.hist.forEach(h=>{const k=ymd(weekStart(fromYmd(h.date)));cnt[k]=(cnt[k]||0)+1});
  let w=weekStart(new Date()),n=0;
  if((cnt[ymd(w)]||0)<3)w.setDate(w.getDate()-7);
  while((cnt[ymd(w)]||0)>=3){n++;w.setDate(w.getDate()-7)}
  return n;
}

function validate(){
  const a=ACT[cur],d=draft;
  const entry={date:ymd(new Date()),ts:Date.now(),letter:cur,note:d.note};
  if(a.kind==="gym"&&DB.loc!=="home"){
    Object.assign(entry,{fat:d.fat,loc:"gym"});
  }else if(a.kind==="gym"){
    const exs=exList(cur);
    exs.forEach(ex=>{if(d.fb[ex.id])adapt(ex,d.fb[ex.id])});
    Object.assign(entry,{fb:d.fb,g:d.g,loc:DB.loc,loads:Object.fromEntries(exs.map(e=>[e.id,loadLabel(e)]))});
  }else if(a.kind==="run"){
    Object.assign(entry,{dur:num($("#f-dur")&&$("#f-dur").value),km:num($("#f-km")&&$("#f-km").value),dplus:num($("#f-dp")&&$("#f-dp").value),rpe:d.rpe});
  }
  DB.hist.push(entry);save();
  chReset();draft=null;cur=null;view="main";tab="cal";
  const n=new Date();calY=n.getFullYear();calM=n.getMonth();selDay=ymd(n);
  render();
}

/* ---------- Calendrier ---------- */
function detailOf(h){
  const a=ACT[h.letter],name=a?a.name:(LEG[h.letter]||h.letter);
  const x=[];
  if(h.dur)x.push(h.dur+" min");if(h.km)x.push(h.km+" km");if(h.dplus)x.push(h.dplus+" m D+");
  if(h.rpe)x.push("RPE "+h.rpe);if(h.g)x.push("global "+h.g+"/5");if(h.loc==="home")x.push("maison KB");if(h.fat)x.push("fatigue : "+FAT[h.fat].toLowerCase());
  const fb=h.fb?Object.entries(h.fb).filter(([id])=>ALLEX[id]).map(([id,f])=>`${esc(ALLEX[id].name.split(/[,(]/)[0].trim())} : ${FB[f].toLowerCase()}`).join(" · "):"";
  return `<div><b>${esc(name)}</b>${x.length?" · "+x.join(" · "):""}${fb?`<div class="tiny">${fb}</div>`:""}${h.note?`<div class="tiny">Note : ${esc(h.note)}</div>`:""}</div>`;
}
function renderCal(){
  if(calY==null){const n=new Date();calY=n.getFullYear();calM=n.getMonth()}
  const first=new Date(calY,calM,1),days=new Date(calY,calM+1,0).getDate(),off=(first.getDay()+6)%7;
  const by={};DB.hist.forEach(h=>(by[h.date]=by[h.date]||[]).push(h));
  const today=ymd(new Date());
  const wk=weekHist(),ess=ESSENTIAL.filter(l=>wk.some(h=>h.letter===l)).length,bonus=wk.filter(h=>!ESSENTIAL.includes(h.letter)&&h.letter!=="M").length;
  const month=DB.hist.filter(h=>{const d=fromYmd(h.date);return d.getFullYear()===calY&&d.getMonth()===calM}).length;
  const label=first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  let cells="";
  for(let i=0;i<off;i++)cells+=`<div class="day empty"></div>`;
  for(let d=1;d<=days;d++){
    const k=calY+"-"+pad(calM+1)+"-"+pad(d),hs=by[k]||[];
    cells+=`<button class="day ${k===today?"today":""} ${k===selDay?"sel":""}" data-day="${k}">${d}${hs.length?`<span class="l">${hs.map(x=>`<i class="${x.letter}">${x.letter}</i>`).join("")}</span>`:(k>=today&&PLANLBL[fromYmd(k).getDay()]?`<span class="pl">${PLANLBL[fromYmd(k).getDay()]}</span>`:"")}</button>`;
  }
  let detail="";
  if(selDay){
    const hs=by[selDay]||[];
    detail=`<h2>${fromYmd(selDay).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}</h2><div class="card detail">`+
      (hs.length?hs.map(detailOf).join(""):`<div class="tiny">${selDay>=today?"Prévu : "+PLANTXT[fromYmd(selDay).getDay()]+".":"Aucune séance ce jour-là."}</div>`)+`</div>`;
  }
  const p=phase();
  $("#app").innerHTML=`<h1>Calendrier</h1>
  <div class="week"><span>Essentiels (renfo ×2 + rugby)</span><b style="color:${ess>=3?"var(--ok)":"var(--text)"}">${ess} / 3</b></div>
  <div class="week"><span>Courses cette semaine</span><b>+${bonus}</b></div>
  <div class="cal-nav"><button data-m="-1" aria-label="Mois précédent">‹</button><b>${label}</b><button data-m="1" aria-label="Mois suivant">›</button></div>
  <div class="grid">${["L","M","M","J","V","S","D"].map(x=>`<div class="dow">${x}</div>`).join("")}${cells}</div>
  <div class="stats"><div class="stat"><b>${DB.hist.length}</b><span>séances au total</span></div><div class="stat"><b>${month}</b><span>ce mois</span></div><div class="stat"><b>${streakWeeks()}</b><span>sem. d’affilée ≥ 3</span></div></div>
  ${detail}
  <h2>Ma course d’ultra</h2>
  <div class="card"><label><div class="tiny">Date de la course (facultatif)</div><input class="inp" id="race" type="date" value="${DB.race||""}"></label>
    <div class="tiny" style="margin-top:8px">${p.w!=null?`Dans ${p.w} semaine${p.w>1?"s":""} · phase ${PH[p.k][0]}. ${PH[p.k][1]}.`:"Sans date, l’app reste en phase Base."}</div></div>
  <h2>Données</h2>
  <div class="row"><button class="btn sec small" id="exp">Copier l’export</button><button class="btn sec small" id="rz" style="color:var(--bad)">Réinitialiser</button></div>
  <p class="tiny">Les données restent sur cet iPhone (stockage local de Safari).</p>`;
}

/* Icône tactile PNG générée (iOS ignore souvent les SVG) */
try{
  const c=document.createElement("canvas");c.width=c.height=180;const g=c.getContext("2d");
  let bg=g.createLinearGradient(0,0,63,180);bg.addColorStop(0,"#5f93d6");bg.addColorStop(.5,"#a9cbe9");bg.addColorStop(1,"#f2dfe8");
  g.fillStyle=bg;g.fillRect(0,0,180,180);
  const P=[[-6,142],[30,112],[56,128],[98,80],[122,98],[160,44]];
  const path=()=>{g.beginPath();P.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y))};
  let kb=g.createLinearGradient(0,44,0,186);kb.addColorStop(0,"#ff9a6b");kb.addColorStop(1,"#e8607f");
  g.lineJoin="round";g.lineCap="round";
  path();g.lineTo(186,44);g.lineTo(186,186);g.lineTo(-6,186);g.closePath();g.fillStyle=kb;g.fill();
  path();g.strokeStyle="#fff";g.lineWidth=8;g.stroke();
  g.fillStyle="#fff";g.beginPath();g.arc(160,44,9,0,Math.PI*2);g.fill();
  $("#touch-icon").href=c.toDataURL("image/png");
}catch(e){}

render();
</script>
